# nginx reverse proxy for connect.sarstage.online
# Place in /etc/nginx/conf.d/connect.conf  (self-managed nginx)
# On WHM/EA-Nginx use the Include Editor and paste the two location blocks.
#
#   /          -> Next.js frontend (pm2: connect-frontend, port 4006)
#   /api/      -> Express backend  (pm2: connect-backend,  port 4005)  [prefix stripped]
#   /socket.io/-> backend Socket.IO (websocket)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name connect.sarstage.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name connect.sarstage.online;

    # SSL: use the cert WHM AutoSSL/certbot issued for this domain.
    ssl_certificate     /etc/letsencrypt/live/connect.sarstage.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.sarstage.online/privkey.pem;

    client_max_body_size 100M;   # media uploads

    # Backend REST API + /uploads  (strip the /api prefix via trailing slash)
    location /api/ {
        proxy_pass         http://127.0.0.1:4005/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO (mobile/live clients) -> backend, websocket upgrade
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:4005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass         http://127.0.0.1:4006;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
